name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    name: typecheck-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize verified g119 image
        run: node scripts/materialize-g119.mjs

      - name: Add g119 to generated manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'src/data/imageManifest.ts';
          let source = readFileSync(file, 'utf8');
          const path = '/images/gallery/g119.jpg';
          if (!source.includes(`"${path}"`)) {
            const anchor = /(^  "\/images\/gallery\/g118\.jpg": .*,$)/m;
            if (!anchor.test(source)) throw new Error('g118 manifest anchor not found');
            source = source.replace(
              anchor,
              `$1\n  "${path}": {"width":480,"height":640,"widths":[360,480]},`
            );
            writeFileSync(file, source, 'utf8');
          }
          NODE

      - name: Commit verified g119 source image and manifest
        if: github.event.pull_request.number == 86 && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/gallery/g119.jpg src/data/imageManifest.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: track verified g119 image"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
