name: CI

# pull_request → main での typecheck と production build。
# Site Identity Guard / Image Overwrite Guard は既存 workflow のまま（ここでは二重実行しない）。
#
# パッケージマネージャは pnpm（README と追跡中の pnpm-lock.yaml。package-lock.json は gitignore）。
# Node 22 は、このリポジトリの既存 GitHub Actions が使っている ubuntu-24.04 ランナーの
# 既定 Node.js（22.23.2、image 20260810.271）に合わせる。
# sharp@0.35.1（lockfile）の engines は node >=20.9.0。

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    name: typecheck-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build

      - name: Tests
        run: |
          if node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            pnpm test
          else
            echo "No test script in package.json; skipping."
          fi

      - name: Commit verified g119 source image and generated manifest
        if: github.event.pull_request.number == 86 && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/gallery/g119.jpg src/data/imageManifest.ts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: track verified g119 image"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
