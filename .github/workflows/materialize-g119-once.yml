name: Materialize g119 once

on:
  push:
    branches:
      - cursor/add-pippara-third-show-20260823-0f6f

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/add-pippara-third-show-20260823-0f6f
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize verified image and regenerate manifest
        run: pnpm run images:build
      - name: Commit generated source image and manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/gallery/g119.jpg src/data/imageManifest.ts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: track verified g119 image"
          git push origin HEAD:cursor/add-pippara-third-show-20260823-0f6f
